name: CORESOLUTIONS quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Validate authored content
        run: npm run validate:content
      - name: Generate technical review prioritization
        run: npm run --silent report:technical-review > technical-review-report.md
      - name: Generate machine-readable technical review data
        run: npm run --silent report:technical-review:json > technical-review-report.json
      - name: Run review priority regressions
        run: npm run test:review-priority
      - name: Run technical review report regressions
        run: npm run test:technical-review-report
      - name: Upload technical review report
        uses: actions/upload-artifact@v4
        with:
          name: technical-review-report-${{ github.run_id }}
          path: |
            technical-review-report.md
            technical-review-report.json
          if-no-files-found: error
          retention-days: 14
      - name: Run AI guard regressions
        run: npm run test:ai-guards
      - name: Run Workbench export regressions
        run: npm run test:workbench-export
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
