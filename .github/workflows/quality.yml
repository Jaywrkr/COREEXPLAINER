name: CORESOLUTIONS quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Validate authored content
        run: npm run validate:content
      - name: Generate technical review package
        run: npm run --silent report:technical-review:package -- --output-dir technical-review-package
      - name: Run review priority regressions
        run: npm run test:review-priority
      - name: Run review action regressions
        run: npm run test:review-actions
      - name: Run review action tracking regressions
        run: npm run test:review-action-tracking
      - name: Run review action export regressions
        run: npm run test:review-action-export
      - name: Run coverage metrics regressions
        run: npm run test:coverage-metrics
      - name: Run Copilot policy regressions
        run: npm run test:copilot-policy
      - name: Run Copilot action contract regressions
        run: npm run test:copilot-actions
      - name: Run Creator policy regressions
        run: npm run test:creator-policy
      - name: Run Support triage regressions
        run: npm run test:support-triage
      - name: Run Support case pack regressions
        run: npm run test:support-case-pack
      - name: Run pattern catalog regressions
        run: npm run test:pattern-validation
      - name: Run failure simulation regressions
        run: npm run test:failure-simulation-validation
      - name: Run source freshness regressions
        run: npm run test:source-freshness
      - name: Run version consistency regressions
        run: npm run test:version-consistency
      - name: Run implementation work package regressions
        run: npm run test:implementation-work-package
      - name: Run implementation readiness report regressions
        run: npm run test:implementation-readiness-report
      - name: Run implementation impact review regressions
        run: npm run test:implementation-impact-review
      - name: Run evidence ledger regressions
        run: npm run test:evidence-ledger
      - name: Run scenario readiness regressions
        run: npm run test:scenario-readiness
      - name: Run technical review report regressions
        run: npm run test:technical-review-report
      - name: Run technical review package regressions
        run: npm run test:technical-review-package
      - name: Upload technical review report
        uses: actions/upload-artifact@v4
        with:
          name: technical-review-report-${{ github.run_id }}
          path: |
            technical-review-package/
          if-no-files-found: error
          retention-days: 14
      - name: Generate implementation readiness artifact
        run: npm run report:implementation-readiness -- --output-dir implementation-readiness-package
      - name: Upload implementation readiness artifact
        uses: actions/upload-artifact@v4
        with:
          name: implementation-readiness-${{ github.run_id }}
          path: implementation-readiness-package/
          if-no-files-found: error
          retention-days: 14
      - name: Run AI guard regressions
        run: npm run test:ai-guards
      - name: Run AI usage telemetry regressions
        run: npm run test:ai-usage-telemetry
      - name: Run Workbench export regressions
        run: npm run test:workbench-export
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
